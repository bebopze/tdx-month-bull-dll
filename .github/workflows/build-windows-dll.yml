name: Build TDXMonthBull Windows DLLs

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} DLL
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Visual C++ environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build and verify exported registration function
        shell: cmd
        run: |
          call build_${{ matrix.arch }}.bat
          if errorlevel 1 exit /b 12
          if not exist dist\${{ matrix.arch }}\TDXMonthBull_${{ matrix.arch }}.dll exit /b 13
          dumpbin /exports dist\${{ matrix.arch }}\TDXMonthBull_${{ matrix.arch }}.dll | findstr /C:"RegisterTdxFunc" >nul
          if errorlevel 1 exit /b 14

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: TDXMonthBull-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/TDXMonthBull_${{ matrix.arch }}.dll
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package both DLL architectures
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download x86 and x64 DLLs
        uses: actions/download-artifact@v4
        with:
          pattern: TDXMonthBull-*
          path: dist
          merge-multiple: true

      - name: Verify and zip DLLs
        shell: pwsh
        run: |
          $expected = @(
            '.\dist\TDXMonthBull_x86.dll',
            '.\dist\TDXMonthBull_x64.dll'
          )
          foreach ($file in $expected) {
            if (!(Test-Path $file)) {
              throw "Expected build artifact not found: $file"
            }
          }
          Compress-Archive -Path '.\dist\TDXMonthBull_x86.dll', '.\dist\TDXMonthBull_x64.dll' -DestinationPath '.\TDXMonthBull_DLLs.zip' -Force

      - name: Upload combined DLL package
        uses: actions/upload-artifact@v4
        with:
          name: TDXMonthBull-x86-x64
          path: TDXMonthBull_DLLs.zip
          if-no-files-found: error
          retention-days: 14
